<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnimeKu - Nonton Anime Sub Indo</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f4f8;--card:#fff;--text:#16151f;--muted:#6a6880;--accent:#e11d48;--line:#e2e1ea;--nav:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e14;--card:#181822;--text:#f2f1fa;--muted:#9391ab;--line:#2a2a3a;--nav:#13131c}}
:root[data-theme="dark"]{--bg:#0e0e14;--card:#181822;--text:#f2f1fa;--muted:#9391ab;--line:#2a2a3a;--nav:#13131c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--nav);border-bottom:2px solid var(--accent)}
.bar{max-width:1200px;margin:0 auto;display:flex;gap:14px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer}
nav a.on,nav a:hover{background:var(--accent);color:#fff}
.sp{flex:1}
input,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button{cursor:pointer}button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:16px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:20px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.hero{border-radius:14px;min-height:160px;display:flex;align-items:center;justify-content:center;padding:22px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden}
.hero h1{margin:4px 0;font-size:28px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.hero p{margin:0;max-width:520px;font-size:14px;opacity:.9}
.tag{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px;border-left:4px solid var(--accent);padding-left:10px}
.sec h2{margin:0;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;margin-bottom:24px}
.card{cursor:pointer;position:relative}
.poster{aspect-ratio:3/4;border-radius:20px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.6);position:relative;overflow:hidden;transition:transform .15s}
.card:hover .poster{transform:scale(1.03)}
.badge{position:absolute;top:6px;left:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.badge.r{left:auto;right:6px;background:rgba(0,0,0,.65)}
.pt{position:absolute;left:0;right:0;bottom:0;padding:34px 8px 10px;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.65) 55%,rgba(0,0,0,0) 100%);color:#fff;text-align:center;font-size:14px;font-weight:700;line-height:1.25;text-shadow:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ct{font-size:13px;margin-top:6px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
.box h3{margin:0 0 10px;font-size:16px}
.rank{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.rank:last-child{border:0}
.rank i{font-style:normal;font-weight:800;color:var(--accent);width:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);cursor:pointer;color:var(--muted)}
.chip.on,.chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.days{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.days .chip{border-radius:6px}
.sch{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer}
.sch span:last-child{color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
#view{display:none}
.player{background:#000;border-radius:12px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#aaa;text-align:center;padding:12px;overflow:hidden}
.player video{width:100%;height:100%}
.player .video-js{width:100%;height:100%}
.player iframe{width:100%;height:100%;border:0}
.urlrow{display:flex;gap:8px;margin:10px 0}.urlrow input{flex:1;min-width:0}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px;max-height:340px;overflow:auto}
.eps button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.desc{color:var(--muted);line-height:1.6;font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.gtile{aspect-ratio:16/6;border-radius:10px;padding:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;cursor:pointer;text-shadow:0 1px 4px rgba(0,0,0,.6);transition:transform .15s}.gtile:hover{transform:scale(1.04)}.gtile b{font-size:14px}.gtile span{font-size:11px;opacity:.9}
.air{font-size:11px;color:var(--muted);margin-top:2px}.air.now{color:var(--accent);font-weight:700}
.gh{grid-column:1/-1;margin:12px 0 4px;font-size:16px}.gh small{color:var(--muted);font-weight:400}
.btn{display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid var(--line);text-decoration:none;color:var(--text);cursor:pointer;background:var(--card);font-size:14px}.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.qr{background:#fff;padding:8px;border-radius:8px;display:inline-block;line-height:0;max-width:100%;box-sizing:border-box;word-break:break-all;color:#333}.qr img,.qr canvas{max-width:100%}.qrimg{width:220px;max-width:100%;background:#fff;padding:8px;border-radius:8px}
.vgl{font-weight:700;font-size:13px;color:var(--text);margin-bottom:6px}
#recs .poster{border-radius:5px;padding:3px}#recs .ct{font-size:10px;margin-top:3px;line-height:1.25;-webkit-line-clamp:2}#recs .pt{font-size:9px;line-height:1.2;padding:14px 3px 4px;-webkit-line-clamp:3}#recs .badge{font-size:8px;padding:1px 3px;top:2px;left:2px}#recs .badge.r{display:none}
@media(max-width:900px){.sp{display:none}#recs{grid-template-columns:repeat(3,1fr)!important;gap:8px!important}#recs .ct{font-size:11px;-webkit-line-clamp:3}#recs .pt{font-size:10px}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}

/* HP: 3 kartu per baris (diletakkan di akhir supaya mengalahkan aturan di atas) */
@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:repeat(3,1fr);gap:10px}.poster{border-radius:14px;padding:6px;font-size:11px}.badge{font-size:10px;padding:1px 6px;top:5px;left:5px}.pt{font-size:11.5px;padding:24px 5px 7px}.air{font-size:10px}.gtile{aspect-ratio:4/3;min-width:0;padding:4px}.gtile b{font-size:12px}.gtile span{font-size:10px}}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video-js.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video.min.js"></script>
</head>
<body>
<header><div class="bar">
  <span class="logo" id="logo">Anime<b>Ku</b></span>
  <nav id="nav"><a class="on" data-n="home">Beranda</a><a data-n="ongoing">Sedang Tayang</a><a data-n="done">Selesai</a><a data-n="genre">Genre</a><a data-n="jadwal">Jadwal</a><a data-n="tentang">Tentang</a></nav>
  <span class="sp"></span>
  <input id="q" placeholder="Cari anime…">
  <button id="th" title="Tema">🌓</button>
</div></header>
<main>
<div id="list">
 <div class="layout">
  <div>
   <div class="hero" id="hero"></div>
   <div class="sec"><h2 id="lt">Episode Terbaru</h2></div>
   <div class="grid" id="grid"></div>
  </div>
  <aside>
   <div class="box"><h3>🔥 Populer</h3><div id="rank"></div></div>
   <div class="box"><h3>💖 Donasi</h3><p class="note" style="margin:0 0 10px">Bantu pengembangan situs.</p><div id="sbdonasi" style="text-align:center"></div><a class="btn" data-n="tentang" style="margin-top:10px;display:block;text-align:center">Info donasi lengkap</a></div>
   <div class="box"><h3>Genre <a data-n="genre" style="font-size:12px;font-weight:400;color:var(--accent);cursor:pointer;float:right">Lihat semua</a></h3><div class="chips" id="chips"></div></div>
  </aside>
 </div>
</div>
<div id="view">
 <button id="back" style="margin-bottom:12px">← Kembali</button>
 <div class="layout">
  <div>
   <div class="sec"><h2 id="vt"></h2></div><div class="desc" id="vd" style="margin-bottom:14px"></div>
   <div class="player" id="player"></div>

<div id="servers" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
  <button id="srv1" class="btn p">Server 1</button>
  <button id="srv2" class="btn">Server 2</button>
</div>
   <div class="urlrow"><input id="url" placeholder="Link atau kode iframe: Mega / MP4 / Streamtape / Doodstream / MP4Upload / StreamSB / YouTube"><button class="p" id="play">Putar</button></div>
   <div class="note" id="alt"></div>
   <div id="dlep" style="margin-top:8px"></div>
  </div>
  <aside><div class="box"><h3>Episode</h3><div class="eps" id="eps"></div><div class="note">URL tiap episode tersimpan di browser ini.</div></div><div class="box" id="dlbox"><h3>⬇️ Download</h3><div id="dllist" class="eps"></div><div class="note" id="dlnote"></div></div>
  <div class="box" id="recbox"><h3>Rekomendasi Anime</h3><div class="grid" id="recs" style="grid-template-columns:repeat(4,1fr);gap:6px;margin:0"></div></div></aside>
 </div>
</div>
</main>
<footer>AnimeKu · Situs Nonton Anime Sub Indonesia</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="data.js"></script>
<script>
const DAYS=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
// Episode otomatis: kalau anime punya pd (tanggal premiere "YYYY-MM-DD"), l dihitung sendiri = 1 episode per minggu
// (br = jumlah minggu libur, mx = batas episode otomatis untuk anime split-cour, keduanya boleh dikosongkan). Tanpa pd, l tetap memakai angka manual dari data.js.
(function(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
DATA.forEach(a=>{if(!a.pd)return;const p=String(a.pd).split("-"),d0=new Date(+p[0],p[1]-1,+p[2]);if(isNaN(d0)||t<d0)return;
const w=Math.floor(Math.round((t-d0)/864e5)/7);a.l=Math.min(a.mx||a.e,Math.max(1,w+1-(a.br||0)));
if(a.day===undefined&&a.l<a.e)a.day=(d0.getDay()+6)%7;});})();
// PENGATURAN SITUS (SITE) ada di data.js (file terpisah).
const donasi=()=>`<div style="grid-column:1/-1"><div class="box"><h3>💖 Dukung AnimeKu</h3><p class="desc">Donasi membantu pengembangan situs. Berapa pun sangat berarti, terima kasih!</p>${SITE.donasi.map(d=>`<div class="sch" style="${d.n?'':'justify-content:center'}"><span>${d.n||''}</span><span>${d.qr?`<div class="qr" data-qr="${d.qr}"></div>`:d.img?`<img class="qrimg" src="${d.img}" alt="QR ${d.n}">`:d.link?`<a class="btn p" href="${d.v}" target="_blank" rel="noopener">Donasi</a>`:d.v}</span></div>`).join("")}</div></div>`;
const mkqr=()=>document.querySelectorAll(".qr").forEach(el=>{el.innerHTML="";if(window.QRCode)new QRCode(el,{text:el.dataset.qr,width:180,height:180});else{el.style.lineHeight="1.4";el.textContent=el.dataset.qr}});
const donasiMini=()=>SITE.donasi.map(d=>d.qr?`<div class="qr" data-qr="${d.qr}"></div>`:d.img?`<img class="qrimg" src="${d.img}" alt="QR donasi">`:d.link?`<a class="btn p" href="${d.v}" target="_blank" rel="noopener">${d.n||'Donasi'}</a>`:`<div class="note">${d.n} ${d.v||''}</div>`).join("");
const kontak=()=>`<div style="grid-column:1/-1"><div class="box"><h3>✉️ Hubungi Kami</h3><p class="desc">Ada saran, request anime, atau laporan masalah? Kirim pesan lewat form ini atau hubungi kami di Telegram.</p><input id="cn" placeholder="Nama" style="width:100%;margin:4px 0"><input id="cs" placeholder="Subjek" style="width:100%;margin:4px 0"><textarea id="cm" rows="5" placeholder="Tulis pesanmu…" style="width:100%;margin:4px 0"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="p" id="csend">Kirim lewat Email</button><a class="btn" href="${SITE.telegram}" target="_blank" rel="noopener">Chat di Telegram</a></div><div class="note">Email: ${SITE.email}</div></div></div>`;
const tentang=()=>`<div style="grid-column:1/-1"><div class="box"><h3>ℹ️ Tentang AnimeKu</h3><p class="desc">AnimeKu adalah katalog anime berbahasa Indonesia berisi daftar anime, genre, dan jadwal rilis. Di halaman ini kamu bisa bergabung dengan komunitas, mendukung situs lewat donasi, atau menghubungi kami.</p></div></div><div style="grid-column:1/-1"><div class="box"><h3>💬 Grup Telegram</h3><p class="desc">Gabung untuk info rilis terbaru, request anime, dan diskusi bareng.</p><a class="btn p" href="${SITE.telegram}" target="_blank" rel="noopener">Join Grup Telegram</a></div></div>${donasi()}${kontak()}`;
// Download: tidak perlu field terpisah. Tombol Download otomatis memakai link episode yang sama di v (link YouTube tidak ikut karena tidak bisa diunduh).
// DATA anime ada di data.js (file terpisah).
const $=s=>document.querySelector(s);
const ADMIN=/[?&]admin/.test(location.search);
if(!ADMIN)document.querySelector(".urlrow").style.display="none";
let cur=null,
    ep=1,
    server=1,
    store={},
    genre="",
    tab="home",
	day=new Date().getDay()===0?6:new Date().getDay()-1;
try{store=JSON.parse(localStorage.getItem("urls")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("urls",JSON.stringify(store))}catch(e){}};
const grad=a=>`linear-gradient(160deg,${a.c[0]},${a.c[1]})`;
const genres=[...new Set(DATA.flatMap(a=>a.g))].sort();
// Urutan server -> kolom data di data.js:
// Server 1 = v (Playmogo, Streamtape, Doodstream, MP4Upload, StreamSB) | Server 2 = v2 (Mega)
const SRVF={1:"v",2:"v2"};
// Boleh isi link biasa ATAU kode <iframe ...src="..."...>: bagian src diambil otomatis
const cleanUrl=u=>{u=String(u||"").trim();const m=u.match(/<iframe[^>]*?\ssrc\s*=\s*["']([^"']+)["']/i);u=(m?m[1]:u).trim();return u.startsWith("//")?"https:"+u:u};
const srvUrl=(n,e)=>cleanUrl(((cur&&cur[SRVF[n]])||{})[e]);
function getUrl(){return srvUrl(server,ep)}
let showAllDone=false,showAllOn=false;
const LIM_ON=15,LIM_DONE=25; // jumlah kartu di Beranda sebelum tombol "Lihat semua"
const todayIdx=()=>{const d=new Date().getDay();return d===0?6:d-1};
const agoDays=a=>a.day===undefined?99:(todayIdx()-a.day+7)%7;
const byAir=(a,b)=>agoDays(a)-agoDays(b)||b.y-a.y||b.l-a.l;
const airLabel=a=>{if(a.l>=a.e||a.day===undefined)return"";const g=agoDays(a);return g===0?"Tayang hari ini":g===1?"Tayang kemarin":"Tayang "+DAYS[a.day]};
function card(a){return `<div class="card" data-id="${a.id}"><div class="poster" style="background:${a.p?`url('${a.p}') center/cover`:grad(a)}"><span class="badge">${a.l<a.e?`● EP ${a.l}`:'TAMAT'}</span><span class="badge r">${a.y}</span><div class="pt">${a.t}</div></div>${airLabel(a)?`<div class="air${agoDays(a)===0?' now':''}">${airLabel(a)}</div>`:''}</div>`}
// Status otomatis: sedang tayang jika l (episode terakhir rilis) < e (total episode), selesai jika l >= e.
const grouped=r=>{const isHome=tab==="home"&&!$("#q").value&&!genre;
  let on=r.filter(a=>a.l<a.e);if(tab==="home")on=[...on].sort(byAir);let done=r.filter(a=>a.l>=a.e);
  const totOn=on.length,totDone=done.length,cutOn=isHome&&!showAllOn&&totOn>LIM_ON,cutDone=isHome&&!showAllDone&&totDone>LIM_DONE;
  if(cutOn)on=on.slice(0,LIM_ON);if(cutDone)done=done.slice(0,LIM_DONE);
  const sec=(t,l,n)=>l.length?`<h3 class="gh">${t} <small>(${n})</small></h3>`+l.map(card).join(""):"";
  const btn=(id,t,n)=>`<div style="grid-column:1/-1;text-align:center;margin:4px 0 20px"><button class="p" id="${id}">Lihat semua ${t} (${n})</button></div>`;
  return (sec("Sedang Tayang",on,totOn)+(cutOn?btn("moreon","Sedang Tayang",totOn):"")+sec("Selesai",done,totDone)+(cutDone?btn("moredone","Selesai",totDone):""))||'<div class="empty">Tidak ada hasil.</div>'};
function render(){
  $("#sbdonasi").innerHTML=donasiMini();mkqr();
  $("#logo").innerHTML=SITE.logo?`<img src="${SITE.logo}" alt="AnimeKu" style="height:34px;vertical-align:middle">`:"Anime<b>Ku</b>";
  const q=$("#q").value.toLowerCase();
  let r=DATA.filter(a=>a.t.toLowerCase().includes(q)&&(!genre||a.g.includes(genre)));
  if(tab==="home"&&!q&&!genre)r=[...r].sort((a,b)=>b.y-a.y||b.l-a.l);
  $("#lt").textContent=genre?"Genre: "+genre:q?"Hasil pencarian":tab==="list"?"Daftar Anime (A–Z)":tab==="ongoing"?"Sedang Tayang":tab==="done"?"Selesai":"Semua Anime";
  if(tab==="list")r=[...r].sort((a,b)=>a.t.localeCompare(b.t));
  if(tab==="ongoing")r=r.filter(a=>a.l<a.e).sort(byAir);
  if(tab==="done")r=r.filter(a=>a.l>=a.e);
  if(tab==="tentang"&&!q&&!genre){$("#lt").textContent="Tentang";$("#grid").innerHTML=tentang();mkqr()}else if(tab==="jadwal"&&!q&&!genre){$("#lt").textContent="Jadwal Rilis";$("#grid").innerHTML=sched()}else if(tab==="genre"&&!genre&&!q){$("#lt").textContent="Semua Genre";$("#grid").innerHTML=genres.map(g=>{const n=DATA.filter(a=>a.g.includes(g));return `<div class="gtile" data-g="${g}" style="background:${grad(n[0])}"><b>${g}</b><span>${n.length} anime</span></div>`}).join("")}else $("#grid").innerHTML=(tab==="home"||tab==="list")?grouped(r):(r.map(card).join("")||'<div class="empty">Tidak ada hasil.</div>');
  $("#hero").style.background="linear-gradient(135deg,#e11d48,#7c3aed)";
  $("#hero").innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px">${SITE.logo?`<img src="${SITE.logo}" alt="Logo AnimeKu" style="max-height:110px;max-width:80%">`:`${SITE.logoBanner?`<img src="${SITE.logoBanner}" alt="Logo AnimeKu" style="height:88px;width:auto">`:`<svg width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="Logo AnimeKu"><rect width="72" height="72" rx="18" fill="#fff"/><path d="M28 21v30l25-15z" fill="#e11d48"/></svg>`}<div style="font-size:42px;font-weight:900;letter-spacing:-1px;line-height:1">Anime<span style="color:#ff2d55">Ku</span></div>`}<div style="font-size:15px;opacity:.95">Situs Nonton Anime Sub Indonesia</div></div>`;
  $("#hero").style.display=(tab==="home"&&!q&&!genre)?"flex":"none";
  $("#rank").innerHTML=[...DATA].sort((a,b)=>b.e-a.e).slice(0,5).map((a,i)=>`<div class="rank" data-id="${a.id}"><i>${i+1}</i><span>${a.t}</span></div>`).join("");
  $("#chips").innerHTML=genres.map(g=>`<span class="chip ${g===genre?'on':''}" data-g="${g}">${g}</span>`).join("");
  function sched(){return `<div style="grid-column:1/-1"><div class="days">${DAYS.map((d,i)=>`<span class="chip ${i===day?'on':''}" data-d="${i}">${d}</span>`).join("")}</div><div class="box">${DATA.filter(a=>a.day===day&&a.l<a.e).map(a=>`<div class="sch" data-id="${a.id}"><span>${a.t}</span><span>EP ${a.l+1}</span></div>`).join("")||'<div class="empty">Tidak ada rilis.</div>'}</div></div>`}
  
  
  
  
}
const dlOk=u=>/^https?:\/\//.test(u||"")&&!/youtu\.?be/.test(u||"");
function fillDl(){const d={};Object.entries(cur.v2||{}).forEach(([k,x])=>d[k]=cleanUrl(x));const ks=Object.keys(d).filter(k=>dlOk(d[k]));$("#dllist").innerHTML="";ks.forEach(k=>{const a=document.createElement("a");a.className="btn";a.textContent="Ep "+k;a.href=d[k];a.target="_blank";a.rel="noopener noreferrer";a.style.cssText="text-align:center;padding:6px 0";$("#dllist").appendChild(a)});$("#dlnote").textContent=ks.length?"Hanya untuk file yang boleh didistribusikan.":"Belum ada link yang bisa diunduh. Link YouTube tidak bisa diunduh dari sini."}
const baseT=a=>a.t.replace(/ \d+(?:st|nd|rd|th) Season| (Season|Part) \d+| \(\d{4}\)| OVA| Movie:.*|: Coleus no Yume| (I|II|III|IV)$|: The Sacred Kingdom.*/g,"").trim();
function fillRec(){const sc=a=>a.g.filter(x=>cur.g.includes(x)).length+(baseT(a)===baseT(cur)?3:0);const r=DATA.filter(a=>a.id!==cur.id).map(a=>({a,s:sc(a)})).filter(x=>x.s>0).sort((x,y)=>y.s-x.s||y.a.y-x.a.y||y.a.l-x.a.l).slice(0,6).map(x=>x.a);$("#recs").innerHTML=r.map(card).join("")||'<div class="empty">Belum ada rekomendasi.</div>'}
function open_(id){
  cur=DATA.find(a=>a.id==id);ep=1;
  $("#list").style.display="none";$("#view").style.display="block";
  $("#vt").textContent=cur.t;$("#vd").innerHTML='<div class="vgl">Genre</div><div class="chips" id="vg"></div><div class="vgl" style="margin-top:14px">Sinopsis</div><p id="vs" style="margin:0"></p>';cur.g.forEach(g=>{const c=document.createElement("span");c.className="chip";c.textContent=g;$("#vg").appendChild(c)});$("#vs").textContent=cur.d;
  $("#eps").innerHTML=Array.from({length:cur.e},(_,i)=>`<button data-e="${i+1}" class="${i?'':'on'}">${i+1}</button>`).join("");
  fillDl();fillRec();load();window.scrollTo(0,0);
}
let vjs=null;
function clearPlayer(){if(vjs){try{vjs.dispose()}catch(e){}vjs=null}$("#player").innerHTML=""}
// Ubah link halaman host jadi link embed yang benar
function embedUrl(u){
  let m;
  if(m=u.match(/^https?:\/\/mega\.(?:nz|io)\/(?:file|embed)\/([\w-]+)(#[\w-]+)?/i))return "https://mega.nz/embed/"+m[1]+(m[2]||"");
  if(m=u.match(/^https?:\/\/(?:www\.)?((?:streamtape|strtape|stape|tapecontent|streamtapeadblock)\.\w+)\/(?:v|e|d)\/([\w-]+)/i))return "https://"+m[1]+"/e/"+m[2];
  if(m=u.match(/^https?:\/\/(?:www\.)?(dood\w*\.\w+|d0o0d\.com|d000d\.com|ds2play\.com|dsvplay\.com|playmogo\.com)\/(?:d|e)\/([\w-]+)/i))return "https://"+m[1]+"/e/"+m[2];
  if(m=u.match(/^https?:\/\/(?:www\.)?mp4upload\.com\/(?:embed-)?(\w+)/i))return "https://www.mp4upload.com/embed-"+m[1]+".html";
  if(m=u.match(/^https?:\/\/(?:www\.)?((?:streamsb|sbembed\d*|sbplay\d*|sbfull|sbchill|watchsb|sbspeed|sblongvu|sbanh|lvturbo)\.\w+)\/(?:v|d|e|play)\/([\w-]+)/i))return "https://"+m[1]+"/e/"+m[2];
  return u;
}
const isDirect=u=>/\.(mp4|webm|m3u8|ogv|m4v)(\?|#|$)/i.test(u);
function showIframe(src,openUrl,label){
  const f=document.createElement("iframe");f.src=src;
  f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen=true;f.referrerPolicy="no-referrer-when-downgrade";
  clearPlayer();$("#player").appendChild(f);
  $("#alt").innerHTML='Tidak muncul? <a target="_blank" rel="noopener" style="color:var(--accent)" href="'+SITE.telegram+'">Report</a> atau coba Server lain.';
}
function showVideo(u){
  clearPlayer();
  const v=document.createElement("video");v.className="video-js vjs-default-skin vjs-big-play-centered";v.setAttribute("playsinline","");
  $("#player").appendChild(v);
  const type=/\.m3u8(\?|#|$)/i.test(u)?"application/x-mpegURL":/\.webm(\?|#|$)/i.test(u)?"video/webm":"video/mp4";
  if(window.videojs){
    vjs=videojs(v,{controls:true,autoplay:false,preload:"auto",fluid:false,fill:true,playbackRates:[0.5,1,1.25,1.5,2],sources:[{src:u,type:type}]});
    vjs.on("error",()=>{$("#alt").innerHTML='Tidak muncul? <a target="_blank" rel="noopener" style="color:var(--accent)" href="'+SITE.telegram+'">Report</a> atau coba Server lain.'});
  }else{v.controls=true;v.src=u}
  $("#alt").textContent="";
}
function showUrl(u,srv){
  $("#alt").textContent="";
  const m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  if(m&&/youtu/.test(u)){showIframe("https://www.youtube.com/embed/"+m[1],"https://www.youtube.com/watch?v="+m[1],"YouTube");return}
  if(isDirect(u)){showVideo(u);return}
  const label=/mega\./i.test(u)?"Mega":"situs asal";
  showIframe(embedUrl(u),u,label);
}
function markServer(){[1,2].forEach(n=>{const b=$("#srv"+n);if(b)b.classList.toggle("p",n===server)})}
function load(){
  markServer();
  const pu=getUrl() || (ADMIN ? store[cur.id+"-"+ep] : "") || "";
  clearPlayer();$("#alt").textContent="";
  const dp=$("#dlep");dp.innerHTML="";
  const own=cleanUrl(cur.v2&&cur.v2[ep]);
  if(dlOk(own)){const a=document.createElement("a");a.className="btn";a.textContent="⬇️ Download episode "+ep;a.href=own;a.target="_blank";a.rel="noopener noreferrer";dp.appendChild(a)}
  if(ADMIN&&$("#url").value){play();return}
  if(pu){showUrl(pu,server);return}
  const other=[1,2].filter(n=>n!==server&&srvUrl(n,ep));
  $("#player").textContent=ADMIN?`Episode ${ep}: tempel URL video lalu tekan Putar.`:`Episode ${ep} belum tersedia di Server ${server}.`+(other.length?` Coba Server ${other.join(" / ")}.`:"");
}
function play(){
  const u=cleanUrl($("#url").value);if(!u)return;
  store[cur.id+"-"+ep]=u;save();
  showUrl(u,0);
}
function home(){$("#view").style.display="none";$("#list").style.display="block";clearPlayer()}
document.addEventListener("click",e=>{
  const t=e.target;if(t.id==="csend"){location.href="mailto:"+SITE.email+"?subject="+encodeURIComponent(($("#cs").value||"Pesan dari AnimeKu")+" - "+($("#cn").value||"Pengunjung"))+"&body="+encodeURIComponent($("#cm").value);return}if(t.id==="moredone"){showAllDone=true;render();return}if(t.id==="moreon"){showAllOn=true;render();return}const c=t.closest("[data-id]");
  if(c){open_(c.dataset.id);return}
  const dd=t.closest("[data-d]");if(dd){day=+dd.dataset.d;render();return}
  const gt=t.closest("[data-g]");if(gt){genre=genre===gt.dataset.g?"":gt.dataset.g;render();return}
  
  if(t.dataset.n){tab=t.dataset.n;genre="";showAllDone=false;showAllOn=false;document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.n===tab));home();render();return}
  if(t.closest("#eps")&&t.dataset.e){ep=+t.dataset.e;document.querySelectorAll("#eps button").forEach(x=>x.classList.toggle("on",x===t));load()}
});
$("#srv1").onclick=()=>{
  server=1;
  load();
};

$("#srv2").onclick=()=>{
  server=2;
  load();
};

$("#back").onclick=home;$("#play").onclick=play;
$("#q").oninput=()=>{home();render()};
$("#th").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()==="#0e0e14";d.dataset.theme=dark?"light":"dark"};
// ===== Rute URL: halaman yang sedang dibuka tersimpan di alamat (#/anime/45, #/genre/Action, #/jadwal, ...) =====
const TABS=["home","ongoing","done","genre","jadwal","tentang"];
let applying=false;
function curHash(){if($("#view").style.display==="block"&&cur)return "#/anime/"+cur.id+(ep>1?"/"+ep:"");if(genre)return "#/genre/"+encodeURIComponent(genre);return tab==="home"?"#/":"#/"+tab}
function pushHash(){if(applying)return;const h=curHash(),now=location.hash||"#/";if(now===h)return;try{history.pushState(null,"",h)}catch(e){location.hash=h}}
function applyHash(){applying=true;try{
  const p=location.hash.replace(/^#\/?/,"").split("/").map(x=>{try{return decodeURIComponent(x)}catch(e){return x}});
  const a=p[0]==="anime"?DATA.find(x=>x.id==p[1]):null;
  if(a){genre="";open_(a.id);const n=+p[2];if(n>1&&n<=cur.e){ep=n;document.querySelectorAll("#eps button").forEach(x=>x.classList.toggle("on",+x.dataset.e===ep));load()}}
  else{tab=TABS.includes(p[0])?p[0]:"home";genre=(tab==="genre"&&p[1])?p[1]:"";document.querySelectorAll("#nav a").forEach(x=>x.classList.toggle("on",x.dataset.n===tab));home();render()}
}finally{applying=false}}
const _render=render;render=function(){_render();pushHash()};
const _load=load;load=function(){_load();pushHash()};
$("#back").onclick=()=>{home();pushHash()};
window.addEventListener("hashchange",applyHash);
applyHash();
</script>
</body>
