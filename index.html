<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnimeKu - Nonton Anime Sub Indo</title>
<link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f4f8;--card:#fff;--text:#16151f;--muted:#6a6880;--accent:#e11d48;--line:#e2e1ea;--nav:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e14;--card:#181822;--text:#f2f1fa;--muted:#9391ab;--line:#2a2a3a;--nav:#13131c}}
:root[data-theme="dark"]{--bg:#0e0e14;--card:#181822;--text:#f2f1fa;--muted:#9391ab;--line:#2a2a3a;--nav:#13131c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--nav);border-bottom:2px solid var(--accent)}
.bar{max-width:1200px;margin:0 auto;display:flex;gap:14px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer}
nav a.on,nav a:hover{background:var(--accent);color:#fff}
.sp{flex:1}
input,button,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button{cursor:pointer}button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:16px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:20px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.hero{border-radius:14px;min-height:160px;display:flex;align-items:center;justify-content:center;padding:22px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden}
.poster{aspect-ratio:3/4;border-radius:20px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.6);position:relative;overflow:hidden;transition:transform .15s}
.card:hover .poster{transform:scale(1.03)}
.badge{position:absolute;top:6px;left:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.badge.r{left:auto;right:6px;background:rgba(0,0,0,.65)}
.ct{font-size:13px;margin-top:6px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
.box h3{margin:0 0 10px;font-size:16px}
.rank{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.rank:last-child{border:0}
.rank i{font-style:normal;font-weight:800;color:var(--accent);width:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);cursor:pointer;color:var(--muted)}
.chip.on,.chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.days{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.days .chip{border-radius:6px}
.sch{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer}
.sch span:last-child{color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
#view{display:none}
.player{background:#000;border-radius:12px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#aaa;text-align:center;padding:12px;overflow:hidden}
.video-js{width:100%;height:100%}
.urlrow{display:flex;gap:8px;margin:10px 0}.urlrow input{flex:1;min-width:0}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px;max-height:340px;overflow:auto}
.eps button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.desc{color:var(--muted);line-height:1.6;font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.gtile{aspect-ratio:16/6;border-radius:10px;padding:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;cursor:pointer;text-shadow:0 1px 4px rgba(0,0,0,.6);transition:transform .15s}.gtile:hover{transform:scale(1.04)}.gtile b{font-size:14px}.gtile span{font-size:11px;opacity:.9}
.gh{grid-column:1/-1;margin:12px 0 4px;font-size:16px}.gh small{color:var(--muted);font-weight:400}
.btn{display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid var(--line);text-decoration:none;color:var(--text);cursor:pointer;background:var(--card);font-size:14px}.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.qr{background:#fff;padding:8px;border-radius:8px;display:inline-block;line-height:0;max-width:100%;box-sizing:border-box;word-break:break-all;color:#333}.qr img,.qr canvas{max-width:100%}.qrimg{width:220px;max-width:100%;background:#fff;padding:8px;border-radius:8px}
.vgl{font-weight:700;font-size:13px;color:var(--text);margin-bottom:6px}
#recs .poster{border-radius:5px;padding:3px}#recs .ct{font-size:10px;margin-top:3px;line-height:1.25;-webkit-line-clamp:2}#recs .badge{font-size:8px;padding:1px 3px;top:2px;left:2px}#recs .badge.r{display:none}
@media(max-width:900px){.sp{display:none}#recs{grid-template-columns:repeat(3,1fr)!important;gap:8px!important}#recs .ct{font-size:11px;-webkit-line-clamp:3}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
</style>
</head>
<body>
<header><div class="bar">
  <span class="logo" id="logo">Anime<b>Ku</b></span>
  <nav id="nav"><a class="on" data-n="home">Beranda</a><a data-n="ongoing">Sedang Tayang</a><a data-n="done">Selesai</a><a data-n="genre">Genre</a><a data-n="jadwal">Jadwal</a><a data-n="tentang">Tentang</a></nav>
  <span class="sp"></span>
  <input id="q" placeholder="Cari anime…">
  <button id="th" title="Tema">🌓</button>
</div></header>
<main>
<div id="list">
  <div class="layout">
    <div>
      <div class="hero" id="hero"></div>
      <div class="sec"><h2 id="lt">Episode Terbaru</h2></div>
      <div class="grid" id="grid"></div>
    </div>
    <aside>
      <div class="box"><h3>🔥 Populer</h3><div id="rank"></div></div>
      <div class="box"><h3>💖 Donasi</h3><p class="note" style="margin:0 0 10px">Bantu pengembangan situs.</p><div id="sbdonasi" style="text-align:center"></div><a class="btn" data-n="tentang" style="margin-top:10px;display:block;text-align:center">Info donasi lengkap</a></div>
      <div class="box"><h3>Genre <a data-n="genre" style="font-size:12px;font-weight:400;color:var(--accent);cursor:pointer;float:right">Lihat semua</a></h3><div class="chips" id="chips"></div></div>
    </aside>
  </div>
</div>

<div id="view" style="display:none">
 <button id="back" style="margin-bottom:12px">← Kembali</button>
 <div class="layout">
  <div>
   <div class="sec"><h2 id="vt"></h2></div><div class="desc" id="vd" style="margin-bottom:14px"></div>
   <div class="player" id="player">Player</div>
   <div class="urlrow">
     <input id="url" placeholder="Link YouTube / Mega atau URL video (.mp4 / .webm / .m3u8)">
     <select id="serverSel" title="Pilih server" style="border-radius:8px;padding:7px 10px;border:1px solid var(--line);background:var(--card);margin-left:6px">
       <option value="1">Server 1 (Mega)</option>
       <option value="2">Server 2 (MP4 - Video.js)</option>
       <option value="3">Server 3 (Universal)</option>
     </select>
     <button class="p" id="play">Putar</button>
   </div>
   <div class="note" id="alt"></div>
   <div id="dlep" style="margin-top:8px"></div>
  </div>
  <aside>
    <div class="box"><h3>Episode</h3><div class="eps" id="eps"></div><div class="note">URL tiap episode tersimpan di browser ini.</div></div>
    <div class="box" id="dlbox"><h3>⬇️ Download</h3><div id="dllist" class="eps"></div><div class="note" id="dlnote"></div></div>
    <div class="box" id="recbox"><h3>Rekomendasi Anime</h3><div class="grid" id="recs" style="grid-template-columns:repeat(4,1fr);gap:6px;margin:0"></div></div>
  </aside>
 </div>
</div>

</main>
<footer>AnimeKu · Situs Nonton Anime Sub Indonesia</footer>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const ADMIN=/[?&]admin/.test(location.search);
if(!ADMIN) document.querySelector(".urlrow").style.display = "none";

let cur=null, ep=1, store={}, genre="", tab="home", day=new Date().getDay()===0?6:new Date().getDay()-1;
try{ store=JSON.parse(localStorage.getItem("urls")||"{}"); }catch(e){}
const save = ()=>{ try{ localStorage.setItem("urls", JSON.stringify(store)); }catch(e){} };

let vjsPlayer = null;
const grad = a => `linear-gradient(160deg,${a.c[0]},${a.c[1]})`;
const genres = [...new Set(DATA.flatMap(a=>a.g))].sort();

function card(a){ return `<div class="card" data-id="${a.id}"><div class="poster" style="background:${a.p?`url('${a.p}') center/cover`:grad(a)}"><span class="badge">${a.l<a.e?`● EP ${a.l}`:'TAMAT'}</span><span class="badge r">${a.y}</span></div><div class="ct">${a.t}</div></div>` }

function render(){
  $("#sbdonasi").innerHTML = SITE && SITE.donasi ? SITE.donasi.map(d=>d.qr?`<div class="qr" data-qr="${d.qr}"></div>`:d.img?`<img class="qrimg" src="${d.img}">`:'').join('') : '';
  mkqr();
  $("#logo").innerHTML = SITE.logo?`<img src="${SITE.logo}" alt="AnimeKu" style="height:34px;vertical-align:middle">`:"Anime<b>Ku</b>";
  const q = $("#q").value.toLowerCase();
  let r = DATA.filter(a => a.t.toLowerCase().includes(q) && (!genre || a.g.includes(genre)));
  if(tab==="home" && !q && !genre) r = [...r].sort((a,b)=>b.y-a.y||b.l-a.l);
  $("#lt").textContent = genre ? "Genre: "+genre : q ? "Hasil pencarian" : "Semua Anime";
  $("#grid").innerHTML = r.map(card).join("") || '<div class="empty">Tidak ada hasil.</div>';
  $("#hero").style.background = "linear-gradient(135deg,#e11d48,#7c3aed)";
  $("#hero").innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px"><div style="font-size:42px;font-weight:900;letter-spacing:-1px;line-height:1">Anime<span style="color:#ff2d55">Ku</span></div><div style="font-size:15px;opacity:.95">Situs Nonton Anime Sub Indonesia</div></div>`;
}

function mkqr(){ document.querySelectorAll(".qr").forEach(el=>{ el.innerHTML=""; if(window.QRCode) new QRCode(el,{text:el.dataset.qr,width:180,height:180}); else el.textContent=el.dataset.qr; }) }

function getEpisodeUrlForServer(selectedServer){
  if(!cur || !cur.v) return "";
  const raw = cur.v[ep];
  if(!raw) return "";
  if(typeof raw === "string") return raw;
  if(typeof raw === "object"){
    return raw[selectedServer] || raw["1"] || Object.values(raw)[0] || "";
  }
  return "";
}

function copyToClipboard(text){
  if(!text) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert("Link disalin ke clipboard."),()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select();
  try{document.execCommand("copy"); alert("Link disalin ke clipboard.");}catch(e){alert("Salin manual: "+text)}
  document.body.removeChild(ta);
}
function reportToTelegramDirect(group, prefilledText, url){
  const encodedText = encodeURIComponent(prefilledText + (url?("\n"+url):""));
  const deep1 = `tg://resolve?domain=${group}&text=${encodedText}`;
  const webShare = `https://t.me/share/url?url=${encodeURIComponent(url||'')}&text=${encodeURIComponent(prefilledText)}`;
  try{ window.open(deep1, "_blank"); }catch(e){}
  setTimeout(()=>{ try{ window.open(webShare, "_blank"); }catch(e){ try{ window.open(`https://t.me/${group}`,"_blank"); }catch(e){} } },700);
}
function setAltWithActions(u, noteText){
  const textNote = noteText||"Video Tidak Mucul (Error) ?";
  const html = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="color:var(--muted)">${textNote}</span><button class="btn" id="copyLink">Salin link</button><button class="btn p" id="autoReport">Laporkan otomatis</button><a class="btn" href="https://t.me/ANlMEKU" target="_blank" rel="noopener" style="margin-left:auto">Buka Grup</a></div>`;
  $("#alt").innerHTML = html;
  const copyBtn = document.getElementById("copyLink");
  if(copyBtn) copyBtn.onclick = ()=> copyToClipboard(u||window.location.href);
  const repBtn = document.getElementById("autoReport");
  if(repBtn) repBtn.onclick = ()=>{
    const title = cur?cur.t:"";
    const message = `[Report] ${title} EP ${ep} - Link: ${u||""}\nHalaman: ${location.href}`;
    reportToTelegramDirect("ANlMEKU", message, u||location.href);
  };
}

function playDefault(u){
  if(!u) return;
  if(vjsPlayer){ try{ vjsPlayer.dispose(); }catch(e){} vjsPlayer = null; }
  const mg = u.match(/^https?:\/\/mega\.(?:nz|io)\/(?:file|embed)\/([\w-]+)(#[\w-]+)?/);
  if(mg){
    const f=document.createElement("iframe");
    f.src="https://mega.nz/embed/"+mg[1]+(mg[2]||"");
    f.allow="autoplay; fullscreen";
    setAltWithActions(u, "Video Tidak Mucul (Error) ?");
    f.allowFullscreen=true; f.style.cssText="width:100%;height:100%;border:0";
    $("#player").innerHTML=""; $("#player").appendChild(f); return;
  }
  const m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  if(m){
    const f=document.createElement("iframe");
    f.src="https://www.youtube.com/embed/"+m[1];
    f.referrerPolicy="strict-origin-when-cross-origin";
    setAltWithActions(u, "Video Tidak Mucul (Error) ?");
    f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen=true;
    f.style.cssText="width:100%;height:100%;border:0";
    $("#player").innerHTML=""; $("#player").appendChild(f); return;
  }
  const v=document.createElement("video");
  v.controls=true; v.autoplay=true; v.src=u;
  v.onerror=()=>{ $("#player").innerHTML=''; setAltWithActions(u, "Video Tidak Mucul (Error) ?"); };
  $("#player").innerHTML=""; $("#player").appendChild(v);
}

function embedUniversal(u){
  if(!u) return false;
  const map = [
    {re:/streamtape\.com\/(?:v|e)\/([A-Za-z0-9_-]+)/i, tmpl:'https://streamtape.com/e/$1'},
    {re:/(?:dood(?:stream)?\.(?:to|so|watch|bz|lol|ws|pm|sx)|doodstream\.com)\/(?:d\/|e\/)?([A-Za-z0-9_-]{6,})/i, tmpl:'https://dood.to/e/$1'},
    {re:/mp4upload\.com\/(?:v\/|embed-)?([A-Za-z0-9_-]+)/i, tmpl:'https://www.mp4upload.com/embed-$1.html'},
    {re:/streamsb\.net\/(?:v|e)\/([A-Za-z0-9_-]+)/i, tmpl:'https://streamsb.net/e/$1'},
    {re:/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/, tmpl:'youtube'},
    {re:/mega\.(?:nz|io)\/(?:file|embed)\/([\w-]+)/i, tmpl:'mega'}
  ];
  for(const e of map){
    const m = u.match(e.re);
    if(!m) continue;
    if(e.tmpl==='youtube'){ const f=document.createElement("iframe"); f.src="https://www.youtube.com/embed/"+m[1]; setAltWithActions(u,"Video Tidak Mucul (Error) ?"); f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen"; f.style.cssText="width:100%;height:100%;border:0"; $("#player").innerHTML=""; $("#player").appendChild(f); return true; }
    if(e.tmpl==='mega'){ const f=document.createElement("iframe"); f.src="https://mega.nz/embed/"+m[1]; setAltWithActions(u,"Video Tidak Mucul (Error) ?"); f.allow="autoplay; fullscreen"; f.style.cssText="width:100%;height:100%;border:0"; $("#player").innerHTML=""; $("#player").appendChild(f); return true; }
    const src = e.tmpl.replace(/\$(\d)/g, (_,n)=>m[n]||'');
    const f = document.createElement("iframe");
    f.src = src;
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    setAltWithActions(u,"Video Tidak Mucul (Error) ?");
    f.style.cssText="width:100%;height:100%;border:0";
    $("#player").innerHTML=""; $("#player").appendChild(f);
    return true;
  }
  if(/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i.test(u)){
    if(vjsPlayer){ try{ vjsPlayer.dispose(); }catch(e){} vjsPlayer=null; }
    const tag = document.createElement("video");
    tag.className = "video-js vjs-big-play-centered";
    tag.id = "vjs-player";
    tag.controls = true; tag.autoplay = true; tag.playsInline = true;
    $("#player").innerHTML=""; $("#player").appendChild(tag);
    if(window.videojs){
      try{
        vjsPlayer = videojs('vjs-player', { controls:true, autoplay:true, preload:'auto' });
        const type = /\.m3u8/i.test(u) ? 'application/x-mpegURL' : (/\.webm/i.test(u) ? 'video/webm' : 'video/mp4');
        vjsPlayer.src({ src: u, type: type });
        return true;
      }catch(e){}
    }
    const nv = document.createElement("video");
    nv.controls = true; nv.autoplay = true; nv.src = u; nv.style.width = "100%"; nv.style.height = "100%";
    nv.onerror = ()=>{ $("#player").innerHTML=''; setAltWithActions(u, "Video Tidak Mucul (Error) ?"); };
    $("#player").innerHTML=""; $("#player").appendChild(nv);
    return true;
  }
  return false;
}

function play(){
  const sel = document.getElementById('serverSel');
  const server = sel ? sel.value : '1';
  const rawUrl = getEpisodeUrlForServer(server);
  const u = $("#url").value.trim() || rawUrl;
  if(!u) return;
  store[cur.id+"-"+ep] = u; save();
  $("#alt").textContent = "";

  if(server === '2'){
    if(/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i.test(u)){
      if(vjsPlayer){ try{ vjsPlayer.dispose(); }catch(e){} vjsPlayer=null; }
      const tag = document.createElement("video");
      tag.className = "video-js vjs-big-play-centered";
      tag.id = "vjs-player";
      tag.controls = true; tag.autoplay = true; tag.playsInline = true;
      $("#player").innerHTML = "";
      $("#player").appendChild(tag);
      if(window.videojs){
        try{
          vjsPlayer = videojs('vjs-player', { controls:true, autoplay:true, preload:'auto' });
          const type = /\.m3u8/i.test(u) ? 'application/x-mpegURL' : (/\.webm/i.test(u) ? 'video/webm' : 'video/mp4');
          vjsPlayer.src({ src: u, type: type });
        }catch(e){
          const nv = document.createElement("video");
          nv.controls = true; nv.autoplay = true; nv.src = u; nv.style.width = "100%"; nv.style.height = "100%";
          nv.onerror = ()=>{ $("#player").innerHTML=''; setAltWithActions(u, "Video Tidak Mucul (Error) ?"); };
          $("#player").innerHTML=""; $("#player").appendChild(nv);
        }
      } else {
        const nv = document.createElement("video");
        nv.controls = true; nv.autoplay = true; nv.src = u; nv.style.width = "100%"; nv.style.height = "100%";
        nv.onerror = ()=>{ $("#player").innerHTML=''; setAltWithActions(u, "Video Tidak Mucul (Error) ?"); };
        $("#player").innerHTML=""; $("#player").appendChild(nv);
      }
      return;
    } else {
      playDefault(u);
      return;
    }
  }

  if(server === '3'){
    const ok = embedUniversal(u);
    if(!ok){
      $("#player").innerHTML = '';
      setAltWithActions(u, "Video Tidak Mucul (Error) ?");
      const dp = $("#dlep");
      dp.innerHTML = '<div style="margin-top:8px"><button class="btn" id="tryDefault">Coba dengan mode biasa</button></div>';
      const tryBtn = document.getElementById("tryDefault");
      if(tryBtn) tryBtn.onclick = ()=>{ playDefault(u); dp.innerHTML=""; };
    }
    return;
  }

  playDefault(u);
}

function load(){
  const sel = document.getElementById('serverSel');
  const server = sel ? sel.value : '1';
  const pu = getEpisodeUrlForServer(server) || (ADMIN ? store[cur.id+"-"+ep] : "");
  $("#url").value = pu || "";
  $("#player").textContent = ADMIN ? `Episode ${ep}: tempel URL video lalu tekan Putar.` : (pu ? "" : `Episode ${ep} belum tersedia.`);
  const dp = $("#dlep"); dp.innerHTML = "";
  if(/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i.test(pu)){
    const a = document.createElement("a");
    a.className="btn"; a.textContent = "⬇️ Download episode "+ep; a.href = pu; a.target="_blank"; a.rel="noopener noreferrer";
    a.style.cssText = "text-align:center;padding:6px 0";
    dp.appendChild(a);
  }
  if($("#url").value) play();
}

function open_(id){
  cur = DATA.find(a=>a.id==id); ep=1;
  $("#list").style.display="none"; $("#view").style.display="block";
  $("#vt").textContent = cur.t;
  $("#vd").innerHTML = '<div class="vgl">Genre</div><div class="chips" id="vg"></div><div class="vgl" style="margin-top:14px">Sinopsis</div><p id="vs" style="margin:0"></p>';
  cur.g.forEach(g=>{ const c=document.createElement("span"); c.className="chip"; c.textContent=g; $("#vg").appendChild(c); });
  $("#vs").textContent = cur.d;
  $("#eps").innerHTML = Array.from({length:cur.e}, (_,i)=>`<button data-e="${i+1}" class="${i?'':'on'}">${i+1}</button>`).join("");
  load(); fillDl(); fillRec(); window.scrollTo(0,0);
}

function dlOk(u){ return /^https?:\/\//.test(u||"") && !/youtu\.?be/.test(u||""); }
function fillDl(){
  $("#dllist").innerHTML = "";
  if(!cur) return;
  const d = cur.v || {};
  const entry = d[ep];
  let links = [];
  if(typeof entry === "string" && dlOk(entry)) links.push({k:'1',u:entry});
  else if(typeof entry === "object"){
    for(const k of Object.keys(entry)) if(dlOk(entry[k])) links.push({k,u:entry[k]});
  }
  links.forEach(x=>{
    const a = document.createElement("a");
    a.className = "btn"; a.textContent = "Ep "+ep+" (S"+x.k+")"; a.href = x.u; a.target="_blank"; a.rel="noopener noreferrer";
    a.style.cssText="text-align:center;padding:6px 0";
    $("#dllist").appendChild(a);
  });
  $("#dlnote").textContent = links.length ? "Hanya untuk file yang boleh didistribusikan." : "Belum ada link yang bisa diunduh. Link YouTube tidak bisa diunduh dari sini.";
}
function baseT(a){ return a.t.replace(/ (Season|Part) \d+| \(\d{4}\)| OVA| Movie:.*|: Coleus no Yume| (I|II|III|IV)$|: The Sacred Kingdom.*/g,"").trim(); }
function fillRec(){
  if(!cur) return;
  const sc = a => a.g.filter(x=>cur.g.includes(x)).length + (baseT(a)===baseT(cur)?3:0);
  const r = DATA.filter(a=>a.id!==cur.id).map(a=>({a,s:sc(a)})).filter(x=>x.s>0).sort((x,y)=>y.s-x.s||y.a.y-x.a.y||y.a.l-x.a.l).slice(0,6).map(x=>x.a);
  $("#recs").innerHTML = r.map(card).join("") || '<div class="empty">Belum ada rekomendasi.</div>';
}

document.addEventListener("click", e=>{
  const t=e.target;
  if(t.id==="csend"){ location.href="mailto:"+SITE.email+"?subject="+encodeURIComponent(($("#cs").value||"Pesan dari AnimeKu")+" - "+($("#cn").value||"Pengunjung"))+"&body="+encodeURIComponent($("#cm").value); return; }
  const c=t.closest("[data-id]");
  if(c){ open_(c.dataset.id); return; }
  if(t.closest("#eps") && t.dataset.e){ ep = +t.dataset.e; document.querySelectorAll("#eps button").forEach(x=>x.classList.toggle("on", x===t)); load(); return; }
  if(t.dataset.n){ tab = t.dataset.n; document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.n===tab)); $("#view").style.display="none"; $("#list").style.display="block"; render(); return; }
  const dd = t.closest("[data-d]"); if(dd){ day = +dd.dataset.d; render(); return; }
  const gt = t.closest("[data-g]"); if(gt){ genre = genre===gt.dataset.g?"":gt.dataset.g; render(); return; }
});

$("#back").onclick = ()=>{ $("#view").style.display="none"; $("#list").style.display="block"; if(vjsPlayer){ try{ vjsPlayer.dispose(); }catch(e){} vjsPlayer=null; } };
$("#play").onclick = play;
$("#q").oninput = ()=> { $("#view").style.display="none"; $("#list").style.display="block"; render(); };
$("#th").onclick = ()=> { const d=document.documentElement, dark=getComputedStyle(d).getPropertyValue("--bg").trim()==="#0e0e14"; d.dataset.theme = dark ? "light" : "dark"; };

render();
</script>
</body>
</html>
